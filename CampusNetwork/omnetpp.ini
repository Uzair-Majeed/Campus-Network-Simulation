# omnetpp.ini — NUCES Campus Network Simulation
# Static Routing (Uzair), RIP (Inam), OSPF (Abdul Basit)


[General]
network          = CampusNetwork
sim-time-limit   = 180s
record-eventlog  = true

result-dir = results
output-scalar-file = results/${configname}-${runnumber}.sca
output-vector-file  = results/${configname}-${runnumber}.vec


# ----------------------------------------------------------------
# Static Routing Configuration
# ----------------------------------------------------------------


[Config StaticRouting]
description = "Custom Static Routing (UZAIR-MAJEED)"

# Use custom static routers (_S), disable INET ones (_I)
**.isInet = false

# Router IP addresses

*.coreRouter_S.ipAddress  = "10.0.0.1"
*.seRouter_S.ipAddress    = "10.0.1.2"
*.eeRouter_S.ipAddress    = "10.0.2.2"
*.bbaRouter_S.ipAddress   = "10.0.3.2"
*.adminRouter_S.ipAddress = "10.0.4.2"

# Server IP addresses

*.dnsServer_S.ipAddress = "10.0.5.2"
*.appServer_S.ipAddress = "10.0.6.2"

# Host IP addresses

*.seHost1_S.ipAddress = "192.168.1.2"
*.seHost2_S.ipAddress = "192.168.1.3"
*.seHost3_S.ipAddress = "192.168.1.4"

*.eeHost1_S.ipAddress = "192.168.2.2"
*.eeHost2_S.ipAddress = "192.168.2.3"
*.eeHost3_S.ipAddress = "192.168.2.4"

*.bbaHost1_S.ipAddress = "192.168.3.2"
*.bbaHost2_S.ipAddress = "192.168.3.3"
*.bbaHost3_S.ipAddress = "192.168.3.4"

*.adminHost1_S.ipAddress = "192.168.4.2"
*.adminHost2_S.ipAddress = "192.168.4.3"
*.adminHost3_S.ipAddress = "192.168.4.4"

# Forwarding table configurations

*.coreRouter_S.totalPorts = 6
*.coreRouter_S.routeTable = "192.168.1.0/24:0;192.168.2.0/24:1;192.168.3.0/24:2;192.168.4.0/24:3;10.0.5.0/30:4;10.0.6.0/30:5"

*.seRouter_S.totalPorts    = 4
*.seRouter_S.routeTable    = "0.0.0.0/0:0;192.168.1.2/32:1;192.168.1.3/32:2;192.168.1.4/32:3"

*.eeRouter_S.totalPorts    = 4
*.eeRouter_S.routeTable    = "0.0.0.0/0:0;192.168.2.2/32:1;192.168.2.3/32:2;192.168.2.4/32:3"

*.bbaRouter_S.totalPorts   = 4
*.bbaRouter_S.routeTable   = "0.0.0.0/0:0;192.168.3.2/32:1;192.168.3.3/32:2;192.168.3.4/32:3"

*.adminRouter_S.totalPorts = 4
*.adminRouter_S.routeTable = "0.0.0.0/0:0;192.168.4.2/32:1;192.168.4.3/32:2;192.168.4.4/32:3"

# Host source IP configuration

*.seHost1_S.srcAddress = "192.168.1.2"
*.seHost2_S.srcAddress = "192.168.1.3"
*.seHost3_S.srcAddress = "192.168.1.4"

*.eeHost1_S.srcAddress = "192.168.2.2"
*.eeHost2_S.srcAddress = "192.168.2.3"
*.eeHost3_S.srcAddress = "192.168.2.4"

*.bbaHost1_S.srcAddress = "192.168.3.2"
*.bbaHost2_S.srcAddress = "192.168.3.3"
*.bbaHost3_S.srcAddress = "192.168.3.4"

*.adminHost1_S.srcAddress = "192.168.4.2"
*.adminHost2_S.srcAddress = "192.168.4.3"
*.adminHost3_S.srcAddress = "192.168.4.4"

# Server role and startup settings

*.dnsServer_S.isDnsServer = true
*.dnsServer_S.isAppServer = false
*.dnsServer_S.srcAddress  = "10.0.5.2"
*.dnsServer_S.startTime   = 99999.0

*.appServer_S.isAppServer = true
*.appServer_S.isDnsServer = false
*.appServer_S.srcAddress  = "10.0.6.2"
*.appServer_S.startTime   = 99999.0

# Global DNS and destination settings

**.dnsAddress  = "10.0.5.2"
**.destAddress = "appserver.nuces"

# Default traffic generator parameters

**.trafficProfile = "CBR"
**.packetSize     = 512
**.sendInterval   = 0.1
**.stopTime       = 175.0

# Bursty traffic profile (disabled by default)

# **.trafficProfile = "Bursty"
# **.burstSize      = 10
# **.burstInterval  = 0.01
# **.silenceTime    = 1.0

# Signal recording modes for statistics

**.packetsForwarded.result-recording-modes = count
**.packetsDropped.result-recording-modes   = count
**.perLinkUtilization.result-recording-modes = vector
**.endToEndDelay.result-recording-modes   = stats
**.packetsSent.result-recording-modes     = count
**.packetsReceived.result-recording-modes = count
**.dnsQuerySent.result-recording-modes    = count
**.dnsReplyRcvd.result-recording-modes    = count


# ----------------------------------------------------------------
# RIP Routing Configuration
# ----------------------------------------------------------------


[Config RIP]
description = "RIP Distance-Vector Routing (INET)"

# Enable INET, force RIP only
**.isInet = true
**.hasRip  = true
**.hasOspf = false

# IP Address Configurator

# Auto-configure IPs but let routers learn paths dynamically via RIP
*.configurator.config = xml("<config> \
  <interface hosts='appServer_I' address='10.0.6.2' netmask='255.255.255.0'/> \
  <interface hosts='dnsServer_I' address='10.0.5.2' netmask='255.255.255.0'/> \
  <interface hosts='**' address='10.x.x.x' netmask='255.x.x.x'/> \
</config>")
*.configurator.addStaticRoutes  = true
*.configurator.addDefaultRoutes = true
*.configurator.addSubnetRoutes  = true
*.*Router_I.ipv4.configurator.configureRoutingTable = false

# Link failure scenario configuration

*.scenarioManager.script = xmldoc("scenario_inet.xml")

# RIP protocol intervals and delays

**.rip.updateInterval       = 30s               # Broadcast every 30s
**.rip.routeExpiryTime      = 90s               # Mark dead after 90s
**.rip.routePurgeTime       = 30s               # Delete 30s after marked dead
**.rip.holdDownTime         = 0s                # Instant adaptation
**.rip.triggeredUpdate      = true              # Shout instantly on failure
**.rip.triggeredUpdateDelay = uniform(1s, 5s)   # Prevent network flooding
**.rip.startupTime          = uniform(0s, 1s)   # Stagger boot times

# Split Horizon and Poison Reverse configuration

**.rip.ripConfig = xml(" \
  <config> \
    <interface mode='NoSplitHorizon' metric='1'/> \
  </config>")

*.coreRouter_I.rip.ripConfig = xml(" \
  <config> \
    <interface among='coreRouter_I seRouter_I'    mode='SplitHorizonPoisonedReverse' metric='1'/> \
    <interface among='coreRouter_I eeRouter_I'    mode='SplitHorizonPoisonedReverse' metric='1'/> \
    <interface among='coreRouter_I bbaRouter_I'   mode='SplitHorizonPoisonedReverse' metric='1'/> \
    <interface among='coreRouter_I adminRouter_I' mode='SplitHorizonPoisonedReverse' metric='1'/> \
    <interface mode='NoSplitHorizon' metric='1'/> \
  </config>")

*.seRouter_I.rip.ripConfig = xml(" \
  <config> \
    <interface among='seRouter_I coreRouter_I' mode='SplitHorizonPoisonedReverse' metric='1'/> \
    <interface mode='NoSplitHorizon' metric='1'/> \
  </config>")

*.eeRouter_I.rip.ripConfig = xml(" \
  <config> \
    <interface among='eeRouter_I coreRouter_I' mode='SplitHorizonPoisonedReverse' metric='1'/> \
    <interface mode='NoSplitHorizon' metric='1'/> \
  </config>")

*.bbaRouter_I.rip.ripConfig = xml(" \
  <config> \
    <interface among='bbaRouter_I coreRouter_I' mode='SplitHorizonPoisonedReverse' metric='1'/> \
    <interface mode='NoSplitHorizon' metric='1'/> \
  </config>")

*.adminRouter_I.rip.ripConfig = xml(" \
  <config> \
    <interface among='adminRouter_I coreRouter_I' mode='SplitHorizonPoisonedReverse' metric='1'/> \
    <interface mode='NoSplitHorizon' metric='1'/> \
  </config>")

# ARP configuration

**.arp.cacheTimeout = 60s

# Application layer configuration

**.*Host*_I.numApps               = 1
*.appServer_I.numApps             = 1
*.dnsServer_I.numApps             = 0

**.*Host*_I.app[0].typename       = "TrafficGenerator"
**.*Host*_I.app[0].isInet         = true
**.*Host*_I.app[0].trafficProfile = "CBR"
**.*Host*_I.app[0].packetSize     = 512
**.*Host*_I.app[0].sendInterval   = 0.1
**.*Host*_I.app[0].destAddress    = "10.0.6.2"
**.*Host*_I.app[0].dnsAddress     = "0.0.0.0"
**.*Host*_I.app[0].startTime      = 1.0
**.*Host*_I.app[0].stopTime       = 175.0

*.appServer_I.app[0].typename     = "TrafficGenerator"
*.appServer_I.app[0].isInet       = true
*.appServer_I.app[0].isAppServer  = true
*.appServer_I.app[0].startTime    = 99999.0
*.appServer_I.app[0].stopTime     = 99999.0

# RIP recording modes

**.rip.numRoutes.result-recording-modes = vector
**.rip.sentUpdate.result-recording-modes   = count
**.rip.sentRequest.result-recording-modes  = count
**.rip.rcvdResponse.result-recording-modes = count
*.appServer_I.app[0].endToEndDelay.result-recording-modes = mean,max,vector
**.*Host*_I.app[0].packetsSent.result-recording-modes = count
*.appServer_I.app[0].packetsReceived.result-recording-modes = count
**.ipv4.ip.packetDropped.result-recording-modes = count


# ----------------------------------------------------------------
# OSPF Routing Configuration
# ----------------------------------------------------------------


[Config OSPF]
description = "OSPF Link-State Routing (INET)"

# Enable INET, force OSPF only
**.isInet = true
**.hasOspf = true
**.hasRip  = false

# IP Address Configurator

*.configurator.addStaticRoutes  = true
*.configurator.addDefaultRoutes = true
*.configurator.addSubnetRoutes  = true

*.configurator.config = xml("<config> \
  <interface hosts='appServer_I' address='10.0.6.2' netmask='255.255.255.0'/> \
  <interface hosts='dnsServer_I' address='10.0.5.2' netmask='255.255.255.0'/> \
  <interface hosts='**' address='10.x.x.x' netmask='255.x.x.x'/> \
</config>")

*.*Router_I.ipv4.configurator.configureRoutingTable = false

# OSPF interface and area configuration

# Backbone Area 0, cost 10, 2s Hello / 8s Dead interval for fast convergence
**.ospf.ospfConfig = xml("<OSPFASConfig> \
  <Router name='**' RFC1583Compatible='true'> \
    <BroadcastInterface ifName='eth[*]' areaID='0.0.0.0' interfaceOutputCost='10' \
        helloInterval='2' routerDeadInterval='8' \
        retransmissionInterval='5' interfaceTransmissionDelay='1' \
        routerPriority='1' pollInterval='120' /> \
  </Router> \
</OSPFASConfig>")

# Link failure scenario configuration

*.scenarioManager.script = xmldoc("scenario_inet.xml")

# Application layer configuration

**.*Host*_I.numApps               = 1
*.appServer_I.numApps             = 1
*.dnsServer_I.numApps             = 0

**.*Host*_I.app[0].typename       = "TrafficGenerator"
**.*Host*_I.app[0].isInet         = true
**.*Host*_I.app[0].trafficProfile = "CBR"
**.*Host*_I.app[0].packetSize     = 512
**.*Host*_I.app[0].sendInterval   = 0.1
**.*Host*_I.app[0].destAddress    = "10.0.6.2"
**.*Host*_I.app[0].dnsAddress     = "0.0.0.0"
**.*Host*_I.app[0].startTime      = 1.0
**.*Host*_I.app[0].stopTime       = 175.0

*.appServer_I.app[0].typename     = "TrafficGenerator"
*.appServer_I.app[0].isInet       = true
*.appServer_I.app[0].isAppServer  = true
*.appServer_I.app[0].startTime    = 99999.0
*.appServer_I.app[0].stopTime     = 99999.0

# OSPF recording modes

**.ipv4.routingTable.numRoutes.result-recording-modes = vector
**.ospf.packetSent.result-recording-modes     = count
**.ospf.packetReceived.result-recording-modes = count
*.appServer_I.app[0].endToEndDelay.result-recording-modes = mean,max,vector
**.*Host*_I.app[0].packetsSent.result-recording-modes    = count
*.appServer_I.app[0].packetsReceived.result-recording-modes = count
**.ipv4.ip.packetDropped.result-recording-modes = count


# ----------------------------------------------------------------
# Bursty Traffic Variants
# ----------------------------------------------------------------


[Config StaticRouting_Bursty]
description = "Custom Static Routing — Bursty Traffic (CBR base, bursty override)"
extends = StaticRouting

# Override for bursty traffic
**.trafficProfile = "Bursty"
**.burstSize      = 10      
**.burstInterval  = 0.001   
**.silenceTime    = 1.0     


[Config RIP_Bursty]
description = "RIP Distance-Vector Routing — Bursty Traffic"
extends = RIP

# Override for bursty traffic
**.*Host*_I.app[0].trafficProfile = "Bursty"
**.*Host*_I.app[0].burstSize      = 10
**.*Host*_I.app[0].burstInterval  = 0.001
**.*Host*_I.app[0].silenceTime    = 1.0


[Config OSPF_Bursty]
description = "OSPF Link-State Routing — Bursty Traffic"
extends = OSPF

# Override for bursty traffic
**.*Host*_I.app[0].trafficProfile = "Bursty"
**.*Host*_I.app[0].burstSize      = 10
**.*Host*_I.app[0].burstInterval  = 0.001
**.*Host*_I.app[0].silenceTime    = 1.0